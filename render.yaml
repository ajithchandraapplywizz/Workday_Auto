services:
  # 1. Automation Backend Service (Playwright Queue Daemon)
  - type: web
    name: workday-automation-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # Note: Playwright requires at least Starter / 512MB-1GB RAM
    envVars:
      - key: PORT
        value: "8080"
      - key: HEADLESS
        value: "true"
      - key: NODE_ENV
        value: "production"
      - key: WORKER_COUNT
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # 2. Frontend React Dashboard (Static Site)
  - type: web
    name: workday-frontend-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: workday-automation-backend
          property: host
